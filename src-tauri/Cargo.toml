[package]
name = "capybudget"
version = "1.4.1"
description = "Personal finance tracker with CSV-backed storage"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "capybudget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Default (DMG / dev / CI) build. The sandboxed Mac App Store build drops the
# self-updater and shell-spawn stacks via `--no-default-features --features mas`,
# which App Review's sandbox forbids.
default = ["updater", "shell-spawn"]
# Sandboxed Mac App Store build marker. Pulls in the macOS-only objc2 stack for
# security-scoped bookmarks (see src/security_scope.rs). Only ever enabled on
# macOS by scripts/build-mas.mjs.
mas = ["dep:objc2", "dep:objc2-foundation", "dep:base64"]
# Self-updater + process relaunch (tauri-plugin-updater / -process).
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
# Subprocess spawning for the Claude Code CLI adapter (tauri-plugin-shell).
shell-spawn = ["dep:tauri-plugin-shell"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2"
tauri-plugin-shell = { version = "2.3.5", optional = true }
tauri-plugin-store = "2"

# MAS-only (macOS), enabled by the `mas` feature: NSURL security-scoped bookmarks.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSString",
    "NSData",
    "NSError",
    "NSArray",
    "NSURL",
] }
base64 = { version = "0.22", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-window-state = "2"

